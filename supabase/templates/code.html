<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#F9FAFB;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F9FAFB;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border-radius:16px;border:1px solid #F3F4F6;padding:32px 28px;">
            <tr>
              <td style="font-size:17px;font-weight:700;color:#1B4332;padding-bottom:20px;">Eat Out Better</td>
            </tr>
            <tr>
              <td style="font-size:22px;font-weight:700;color:#111827;padding-bottom:8px;">Your sign-in code</td>
            </tr>
            <tr>
              <td style="font-size:16px;line-height:24px;color:#4B5563;padding-bottom:24px;">
                Type this code into the app to finish signing in.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <div style="display:inline-block;font-size:34px;font-weight:700;letter-spacing:8px;color:#111827;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;padding:14px 22px;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:21px;color:#4B5563;">
                It expires in one hour. If you didn't ask for it, you can ignore this
                email — nothing changes on your account.
              </td>
            </tr>
          </table>
          <p style="font-size:12px;color:#6B7280;margin:16px 0 0;">
            Eat Out Better · Dine Right LLC · <a href="https://eat-out-better-api.vercel.app/privacy" style="color:#6B7280;">Privacy</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
